<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Control de Asistencia</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    select,
    button {
      width: 100%;
      max-width: 500px;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
      box-sizing: border-box;
    }

    #resultado {
      width: 100%;
      max-width: 500px;
      margin: 20px auto 10px auto;
      padding: 15px;
      box-sizing: border-box;
      font-size: 18px;
      background: white;
      border-radius: 8px;
      min-height: 25px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      overflow: hidden;
    }

  </style>

</head>

<body>

  <h1>Control de Asistencia</h1>

  <select id="taller">

    <option value="">
      Seleccionar taller
    </option>

    <option value="BLND3D">
      Modelado 3D con Blender
    </option>

    <option value="BLND2D">
      Animación Digital 2D con Blender
    </option>

    <option value="CLINPA">
      Pruebas estadísticas para la clasificación inteligente de patrones en aprendizaje automático
    </option>

    <option value="DGODOT">
      Desarrollo de shaders en Godot para videojuegos
    </option>

    <option value="DESFSG">
      Desarrollo de software seguro
    </option>

    <option value="GOEAEN">
      Introducción a Google Earth Engine
    </option>

    <option value="LDINTI">
      Liderazgo para la innovación en TI
    </option>

  </select>


  <button onclick="iniciarScanner()">
    Iniciar cámara
  </button>


  <!--
    El resultado aparece ANTES de la cámara
  -->

  <div id="resultado">
    Selecciona un taller y después inicia la cámara.
  </div>


  <div id="reader"></div>


  <script>

    let scanner = null;
    let procesando = false;


    function iniciarScanner() {

      const taller =
        document.getElementById('taller').value;

      if (!taller) {

        mostrarResultado(
          '⚠️ Selecciona primero un taller.'
        );

        return;
      }


      if (scanner) {
        return;
      }


      mostrarResultado(
        '📷 Iniciando cámara...'
      );


      scanner =
        new Html5Qrcode('reader');


      scanner.start(

        {
          facingMode: 'environment'
        },

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          }
        },

        onScanSuccess,

        onScanError

      )

      .catch(function(error) {

        mostrarResultado(
          '❌ No se pudo iniciar la cámara.'
        );

        console.error(error);

        scanner = null;

      });

    }


    function onScanSuccess(decodedText) {

      if (procesando) {
        return;
      }

      procesando = true;


      const taller =
        document.getElementById('taller').value;


      mostrarResultado(
        '🔎 QR detectado<br>' +
        'Verificando asistencia...'
      );


      enviarAsistencia(
        decodedText,
        taller
      );

    }


    function onScanError(error) {
      // Ignorar errores normales de búsqueda
    }


    function enviarAsistencia(id, taller) {

      const URL_BACKEND =
        'https://script.google.com/macros/s/AKfycbxHl5FuITA0mZ5uPGhy5BAmkRVIHV6wf-sVn6dyL0JL5piABsAhrlUdL6IK_kJhkLm50A/exec';


      fetch(

        URL_BACKEND,

        {

          method: 'POST',

          headers: {
            'Content-Type': 'text/plain'
          },

          body: JSON.stringify({

            id: id,

            taller: taller

          })

        }

      )

      .then(function(response) {

        return response.json();

      })

      .then(function(data) {


        if (data.ok) {

          mostrarResultado(

            '✅ ' +
            data.mensaje +

            '<br><br>' +

            'ID: ' +
            data.id +

            '<br>' +

            'Nombre: ' +
            data.nombre

          );


        } else {

          mostrarResultado(

            '⚠️ ' +
            data.mensaje +

            (

              data.nombre

              ? '<br><br>Nombre: ' +
                data.nombre

              : ''

            )

          );

        }


        setTimeout(

          function() {

            procesando = false;

          },

          2000

        );

      })


      .catch(function(error) {


        mostrarResultado(

          '❌ Error de comunicación con el servidor.'

        );


        console.error(error);


        setTimeout(

          function() {

            procesando = false;

          },

          2000

        );

      });

    }


    function mostrarResultado(mensaje) {

      document.getElementById(
        'resultado'
      ).innerHTML = mensaje;

    }

  </script>

</body>

</html>
